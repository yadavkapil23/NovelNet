{% extends 'base.html' %}

{% block title %}Sign In - Novel Net{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-4 col-md-6">
            <div class="card">
                <div class="card-header text-center">
                    <h3 class="card-title mb-0">
                        <i class="fas fa-sign-in-alt me-2"></i>
                        Sign In to Novel Net
                    </h3>
                    <p class="text-muted mb-0">Access your account to upload and manage books</p>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" id="id_username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" id="id_password" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt me-2"></i>
                                Sign In
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <p class="text-muted mb-0">
                        Don't have an account?
                        <a href="{% url 'email_verification' %}" class="text-decoration-none">Create one</a>
                    </p>
                    <div class="mt-2">
                        <a href="/admin/" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-user-shield me-1"></i> Admin Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
